# HorizontalPodAutoscalers for the load-sensitive components (see ARCHITECTURE §8).
# Requires metrics-server installed in the cluster.
# minReplicas here is a baseline; overlays patch it (dev pins to 1).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  namespace: matchly
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: matchly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: matching-service
  namespace: matchly
  labels:
    app.kubernetes.io/name: matching-service
    app.kubernetes.io/part-of: matchly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: matching-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-service
  namespace: matchly
  labels:
    app.kubernetes.io/name: ai-service
    app.kubernetes.io/part-of: matchly
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
