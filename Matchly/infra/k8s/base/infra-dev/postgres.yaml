# DEV-ONLY single-replica PostgreSQL (pgvector) with per-service DBs created by
# the init script. NOT for production — prod uses managed RDS (see Terraform).
# Uses emptyDir-equivalent persistence via a small PVC; data is NOT highly
# available and may be lost on node failure.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: matchly
data:
  init-databases.sh: |
    #!/bin/bash
    set -e
    for db in auth_db candidate_db job_db application_db matching_db \
              interview_db analytics_db ai_db; do
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" <<-EOSQL
        SELECT 'CREATE DATABASE $db' WHERE NOT EXISTS
          (SELECT FROM pg_database WHERE datname = '$db')\gexec
    EOSQL
    done
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" -d ai_db \
      -c "CREATE EXTENSION IF NOT EXISTS vector;"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: matchly
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: matchly-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: matchly-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: matchly
  labels:
    app.kubernetes.io/name: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
