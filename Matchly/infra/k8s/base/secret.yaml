# =============================================================================
# SECRET TEMPLATE — DO NOT COMMIT REAL VALUES.
# These are PLACEHOLDERS. Replace them before applying, and in any real
# environment manage this via a SealedSecret, External Secrets Operator, or
# AWS Secrets Manager (see infra/terraform). Plaintext stringData is used here
# only so the starter manifests are readable.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: matchly-secrets
  namespace: matchly
  labels:
    app.kubernetes.io/part-of: matchly
type: Opaque
stringData:
  # --- JWT (HS256 shared secret; auth-service signs, api-gateway validates) ---
  JWT_SECRET: "REPLACE_ME_with_a_long_random_secret_at_least_32_chars"

  # --- PostgreSQL credentials (one instance, DB-per-service) ---
  POSTGRES_USER: "matchly"
  POSTGRES_PASSWORD: "REPLACE_ME"
  # JDBC datasource creds consumed by Spring services
  SPRING_DATASOURCE_USERNAME: "matchly"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"

  # --- LLM provider API keys (ai-service) ---
  OPENAI_API_KEY: "REPLACE_ME_or_leave_empty_for_template_provider"
  GEMINI_API_KEY: "REPLACE_ME_or_leave_empty_for_template_provider"
