apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: matchly
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: matchly
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: matchly
    spec:
      containers:
        - name: auth-service
          image: matchly/auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: matchly-config
            - secretRef:
                name: matchly-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/auth_db
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: matchly
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: matchly
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
