name: matchly

# Full local stack: infra + all microservices + AI service + frontend.
#   cp .env.example .env && docker compose up --build
# First boot builds all images (Maven build runs inside Docker, so no local
# Maven is required). See STATUS.md for what is fully implemented vs scaffolded.

x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: docker
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-matchly}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-matchly}

services:
  # ---------- Infrastructure ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-matchly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matchly}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchly}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------- AI service ----------
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-matchly}:${POSTGRES_PASSWORD:-matchly}@postgres:5432/ai_db
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      LLM_PROVIDER: ${LLM_PROVIDER:-template}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}

  # ---------- Spring Boot microservices ----------
  auth-service:
    build: ./services/auth-service
    ports: ["8081:8081"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
    depends_on:
      postgres: {condition: service_healthy}

  candidate-service:
    build: ./services/candidate-service
    ports: ["8082:8082"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/candidate_db
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  job-service:
    build: ./services/job-service
    ports: ["8083:8083"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/job_db
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  application-service:
    build: ./services/application-service
    ports: ["8084:8084"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/application_db
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  matching-service:
    build: ./services/matching-service
    ports: ["8085:8085"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/matching_db
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      ai-service: {condition: service_started}

  interview-service:
    build: ./services/interview-service
    ports: ["8086:8086"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_db
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      ai-service: {condition: service_started}

  analytics-service:
    build: ./services/analytics-service
    ports: ["8087:8087"]
    environment:
      <<: *spring-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/analytics_db
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}

  # ---------- API Gateway ----------
  api-gateway:
    build: ./platform/api-gateway
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-at-least-32-chars}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis: {condition: service_healthy}
      auth-service: {condition: service_started}

  # ---------- Frontend ----------
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8080/api/v1}
    ports: ["8088:80"]
    depends_on:
      api-gateway: {condition: service_started}

volumes:
  pgdata:
