# =============================================================================
# Matchly CI — monorepo, path-filtered (ADR-001).
#
# Strategy:
#   - One workflow, triggered on push + PR.
#   - A `changes` job (dorny/paths-filter) computes which areas changed.
#   - Each build job (`ai-service`, `java-services`, `frontend`) runs ONLY when
#     its paths changed, so a frontend-only PR doesn't rebuild the Java matrix.
#   - `java-services` is a matrix over the 7 Spring services + the gateway; build
#     dirs are services/* and platform/api-gateway. Maven .m2 cache is shared.
#   - `docker-build` is a STUB matrix gated to main — wire it to ECR + image
#     push when the registry (see infra/terraform) is ready.
#
# Note: the build matrix lists all 7 services + gateway as specified; some
# service dirs may still be scaffolds in the repo — the job builds whatever is
# present and a missing pom.xml will fail loudly so it gets added.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Detect which parts of the monorepo changed.
  # ---------------------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      ai: ${{ steps.filter.outputs.ai }}
      java: ${{ steps.filter.outputs.java }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ai:
              - 'ai-service/**'
            java:
              - 'services/**'
              - 'platform/api-gateway/**'
              - 'libs/**'
            frontend:
              - 'frontend/**'

  # ---------------------------------------------------------------------------
  # AI service — Python 3.11 + pytest.
  # ---------------------------------------------------------------------------
  ai-service:
    needs: changes
    if: ${{ needs.changes.outputs.ai == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest

  # ---------------------------------------------------------------------------
  # Java services + gateway — Java 17 (Temurin) + Maven, matrix per component.
  # ---------------------------------------------------------------------------
  java-services:
    needs: changes
    if: ${{ needs.changes.outputs.java == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - services/auth-service
          - services/candidate-service
          - services/job-service
          - services/application-service
          - services/matching-service
          - services/interview-service
          - services/analytics-service
          - platform/api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build ${{ matrix.service }}
        run: mvn -B -f ${{ matrix.service }}/pom.xml package

  # ---------------------------------------------------------------------------
  # Frontend — Node 20 + Vite build.
  # ---------------------------------------------------------------------------
  frontend:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker image build (STUB) — only on main. Wire to ECR + push when ready.
  # ---------------------------------------------------------------------------
  docker-build:
    needs: [ai-service, java-services, frontend]
    # Run only on main, and only if nothing upstream failed/cancelled (skipped
    # jobs are allowed — a path-filtered area may legitimately not run).
    if: ${{ github.ref == 'refs/heads/main' && always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - api-gateway
          - auth-service
          - candidate-service
          - job-service
          - application-service
          - matching-service
          - interview-service
          - analytics-service
          - ai-service
          - frontend
    steps:
      - uses: actions/checkout@v4
      - name: Build image (stub)
        run: |
          echo "STUB: would build and push matchly-${{ matrix.component }} to ECR."
          echo "TODO: configure aws-actions/configure-aws-credentials + ECR login,"
          echo "      docker/build-push-action with the per-component context/Dockerfile,"
          echo "      and tag with the git SHA + a release tag."
          # Example (commented until the registry from infra/terraform exists):
          # - uses: aws-actions/configure-aws-credentials@v4
          # - uses: aws-actions/amazon-ecr-login@v2
          # - uses: docker/build-push-action@v6
          #   with:
          #     context: <per-component dir>
          #     push: true
          #     tags: ${{ steps.ecr.outputs.registry }}/matchly-${{ matrix.component }}:${{ github.sha }}
