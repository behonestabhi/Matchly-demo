server:
  port: 8082

spring:
  application:
    name: candidate-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/candidate_db}
    username: ${SPRING_DATASOURCE_USERNAME:matchly}
    password: ${SPRING_DATASOURCE_PASSWORD:matchly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway fully owns the schema; leave DDL to Flyway.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

# Local file storage that stands in for S3 (see README). The stored relative
# path is recorded as the resume's s3Key.
resume:
  storage-dir: ${RESUME_STORAGE_DIR:./data/resumes}

# Downstream services (all env-overridable). Graceful failure if unavailable.
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}
matching:
  service-url: ${MATCHING_SERVICE_URL:http://localhost:8085}

# HTTP client timeouts (milliseconds) for outbound AI / matching calls.
http-client:
  connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${HTTP_CLIENT_READ_TIMEOUT_MS:30000}

# Kafka topic names (env-overridable to ease local experimentation).
kafka:
  topics:
    candidate-events: ${KAFKA_TOPIC_CANDIDATE_EVENTS:candidate.events}
    resume-parsed: ${KAFKA_TOPIC_RESUME_PARSED:resume.parsed}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: info
