server:
  port: 8083

spring:
  application:
    name: job-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job_db}
    username: ${SPRING_DATASOURCE_USERNAME:matchly}
    password: ${SPRING_DATASOURCE_PASSWORD:matchly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway fully owns the schema; leave DDL to Flyway.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# AI service (env-overridable). JD embedding on publish; graceful failure.
ai:
  service-url: ${AI_SERVICE_URL:http://localhost:8000}

# HTTP client timeouts (milliseconds) for outbound AI calls.
http-client:
  connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${HTTP_CLIENT_READ_TIMEOUT_MS:30000}

# Kafka topic names (env-overridable).
kafka:
  topics:
    job-events: ${KAFKA_TOPIC_JOB_EVENTS:job.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: info
