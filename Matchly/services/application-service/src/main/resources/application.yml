server:
  port: 8084

spring:
  application:
    name: application-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/application_db}
    username: ${SPRING_DATASOURCE_USERNAME:matchly}
    password: ${SPRING_DATASOURCE_PASSWORD:matchly}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway fully owns the schema.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

# Kafka topic names — env-overridable.
matchly:
  kafka:
    topics:
      application-events: ${KAFKA_TOPIC_APPLICATION_EVENTS:application.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.flywaydb: info
