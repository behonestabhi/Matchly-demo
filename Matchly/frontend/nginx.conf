server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Long-cache hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every unknown path returns index.html so the client
    # router can handle it. API calls go directly to VITE_API_BASE
    # (absolute URL baked at build time), so no proxy is required here.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
